<script>
(function(){
  var saved='';
  try{saved=localStorage.getItem('welten-language')||'';}catch(error){}
  var browser=(navigator.language||'').toLowerCase();
  var language=(saved==='de'||saved==='en')?saved:(browser.indexOf('en')===0?'en':'de');
  location.replace('./'+language+'/');
})();
</script>
