<script>document.getElementById('year').textContent=new Date().getFullYear();document.querySelectorAll('[data-language]').forEach(function(link){link.addEventListener('click',function(event){var language=link.getAttribute('data-language');try{localStorage.setItem('welten-language',language);}catch(error){}if(link.classList.contains('active')||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();var control=link.closest('.lang-switch');if(control){control.classList.toggle('is-de',language==='de');control.classList.toggle('is-en',language==='en');control.querySelectorAll('a').forEach(function(item){item.classList.toggle('active',item===link);});}window.setTimeout(function(){window.location.href=link.href;},210);});});var bridge=document.getElementById('googleBookingBridge');document.querySelectorAll('[data-google-booking]').forEach(function(trigger){trigger.addEventListener('click',function(event){var button=bridge&&bridge.querySelector('button');if(!button)return;event.preventDefault();button.click();});});</script></body></html>
